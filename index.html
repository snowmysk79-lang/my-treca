<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>MY TRECA</title>

  <style>
    * {
      box-sizing: border-box;
    }

    body {
      margin: 0;
      font-family:
        -apple-system,
        BlinkMacSystemFont,
        "Hiragino Sans",
        "Yu Gothic",
        sans-serif;
      background: #fff7fa;
      color: #555;
    }

    header {
      background: #f3a6bd;
      color: white;
      padding: 18px 16px;
      text-align: center;
      box-shadow: 0 2px 8px rgba(0,0,0,0.08);
    }

    header h1 {
      margin: 0;
      font-size: 22px;
      font-weight: 800;
    }

    header p {
      margin: 4px 0 0;
      font-size: 12px;
      opacity: 0.95;
    }

    main {
      max-width: 900px;
      margin: 0 auto;
      padding: 16px;
    }

    .summary {
      background: white;
      border-radius: 16px;
      padding: 14px 16px;
      margin-bottom: 12px;
      box-shadow: 0 2px 8px rgba(0,0,0,0.05);
      text-align: center;
    }

    .summary-title {
      font-size: 12px;
      color: #999;
    }

    .summary-count {
      font-size: 26px;
      font-weight: 800;
      color: #f3a6bd;
      margin-top: 2px;
    }

    .top-actions {
      display: flex;
      gap: 8px;
      margin-bottom: 12px;
    }

    button {
      border: none;
      cursor: pointer;
      font-family: inherit;
    }

    .add-button {
      flex: 1;
      background: #f3a6bd;
      color: white;
      border-radius: 14px;
      padding: 13px 10px;
      font-size: 14px;
      font-weight: 700;
      box-shadow: 0 3px 8px rgba(243,166,189,0.3);
    }

    .filter-area {
      background: white;
      border-radius: 16px;
      padding: 12px;
      margin-bottom: 14px;
      box-shadow: 0 2px 8px rgba(0,0,0,0.05);
    }

    .filter-row {
      display: flex;
      gap: 8px;
    }

    .filter-box {
      flex: 1;
    }

    .filter-box label {
      display: block;
      font-size: 11px;
      color: #999;
      margin-bottom: 5px;
    }

    select,
    input {
      width: 100%;
      border: 1px solid #ead7dd;
      border-radius: 10px;
      background: white;
      color: #555;
      padding: 10px;
      font-size: 14px;
      outline: none;
    }

    select:focus,
    input:focus {
      border-color: #f3a6bd;
    }

    .grid {
      display: grid;
      grid-template-columns: repeat(4, 1fr);
      gap: 12px;
    }

    .card {
      background: white;
      border-radius: 12px;
      overflow: hidden;
      box-shadow: 0 2px 8px rgba(0,0,0,0.08);
      cursor: pointer;
      transition: transform 0.15s ease;
    }

    .card:active {
      transform: scale(0.97);
    }

    .card-image-wrap {
      position: relative;
      width: 100%;
      aspect-ratio: 0.7;
      background: #f7eef1;
      overflow: hidden;
    }

    .card-image {
      width: 100%;
      height: 100%;
      object-fit: cover;
      display: block;
    }

    .stock-badge {
      position: absolute;
      top: 6px;
      right: 6px;
      min-width: 25px;
      height: 25px;
      padding: 0 6px;
      border-radius: 999px;
      background: #f3a6bd;
      color: white;
      font-size: 12px;
      font-weight: 800;
      display: flex;
      align-items: center;
      justify-content: center;
      box-shadow: 0 2px 5px rgba(0,0,0,0.15);
    }

    .card-info {
      padding: 8px;
    }

    .card-name {
      font-size: 12px;
      font-weight: 700;
      color: #555;
      white-space: nowrap;
      overflow: hidden;
      text-overflow: ellipsis;
    }

    .card-detail {
      font-size: 10px;
      color: #999;
      margin-top: 3px;
      white-space: nowrap;
      overflow: hidden;
      text-overflow: ellipsis;
    }

    .empty {
      grid-column: 1 / -1;
      background: white;
      border-radius: 18px;
      padding: 45px 20px;
      text-align: center;
      color: #aaa;
      box-shadow: 0 2px 8px rgba(0,0,0,0.05);
    }

    .empty-icon {
      font-size: 42px;
      margin-bottom: 10px;
    }

    /* modal */
    .modal {
      display: none;
      position: fixed;
      inset: 0;
      z-index: 1000;
      background: rgba(0,0,0,0.45);
      padding: 20px;
      overflow-y: auto;
    }

    .modal.show {
      display: flex;
      align-items: center;
      justify-content: center;
    }

    .modal-content {
      width: 100%;
      max-width: 500px;
      max-height: 90vh;
      overflow-y: auto;
      background: white;
      border-radius: 20px;
      padding: 20px;
      box-shadow: 0 8px 30px rgba(0,0,0,0.2);
    }

    .modal-title {
      margin: 0 0 16px;
      text-align: center;
      color: #555;
      font-size: 18px;
      font-weight: 800;
    }

    .detail-image {
      width: 100%;
      max-height: 420px;
      object-fit: contain;
      background: #f8eef1;
      border-radius: 14px;
      display: block;
      margin-bottom: 16px;
    }

    .detail-info {
      background: #fff7fa;
      border-radius: 14px;
      padding: 13px;
      margin-bottom: 14px;
    }

    .detail-row {
      display: flex;
      justify-content: space-between;
      gap: 15px;
      padding: 6px 0;
      border-bottom: 1px solid #f0dfe5;
      font-size: 13px;
    }

    .detail-row:last-child {
      border-bottom: none;
    }

    .detail-label {
      color: #999;
      flex-shrink: 0;
    }

    .detail-value {
      color: #555;
      font-weight: 700;
      text-align: right;
      word-break: break-word;
    }

    .detail-count-area {
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 18px;
      margin: 18px 0;
    }

    .count-button {
      width: 44px;
      height: 44px;
      border-radius: 50%;
      background: #f8dce5;
      color: #d87d9b;
      font-size: 24px;
      font-weight: 700;
    }

    .detail-count {
      min-width: 50px;
      text-align: center;
      font-size: 25px;
      font-weight: 800;
      color: #f3a6bd;
    }

    .modal-buttons {
      display: flex;
      gap: 8px;
    }

    .modal-button {
      flex: 1;
      padding: 12px;
      border-radius: 12px;
      font-size: 14px;
      font-weight: 700;
    }

    .button-close {
      background: #eee;
      color: #777;
    }

    .button-edit {
      background: #f3a6bd;
      color: white;
    }

    .button-delete {
      width: 100%;
      margin-top: 8px;
      background: #fff0f0;
      color: #d96b6b;
      padding: 11px;
      border-radius: 12px;
      font-size: 13px;
      font-weight: 700;
    }

    /* form */
    .form-group {
      margin-bottom: 14px;
    }

    .form-group label {
      display: block;
      font-size: 12px;
      font-weight: 700;
      color: #777;
      margin-bottom: 6px;
    }

    .select-add-row {
      display: flex;
      gap: 6px;
      align-items: center;
    }

    .select-add-row select {
      flex: 1;
    }

    .small-add-button {
      flex-shrink: 0;
      background: #f8dce5;
      color: #c96e8b;
      border-radius: 10px;
      padding: 9px 10px;
      font-size: 12px;
      font-weight: 700;
    }

    .photo-area {
      border: 2px dashed #efd4dd;
      border-radius: 14px;
      padding: 14px;
      text-align: center;
      background: #fffafb;
    }

    .photo-area input {
      border: none;
      padding: 0;
      background: transparent;
    }

    .photo-preview {
      width: 130px;
      max-height: 180px;
      object-fit: contain;
      margin: 10px auto 0;
      border-radius: 10px;
      display: none;
    }

    .save-button {
      width: 100%;
      background: #f3a6bd;
      color: white;
      padding: 13px;
      border-radius: 12px;
      font-size: 14px;
      font-weight: 800;
      margin-top: 5px;
    }

    .cancel-button {
      width: 100%;
      background: #eee;
      color: #777;
      padding: 12px;
      border-radius: 12px;
      font-size: 14px;
      font-weight: 700;
      margin-top: 8px;
    }

    .help-text {
      font-size: 10px;
      color: #aaa;
      margin-top: 5px;
      line-height: 1.5;
    }

    @media (max-width: 500px) {
      main {
        padding: 12px;
      }

      .grid {
        grid-template-columns: repeat(4, 1fr);
        gap: 8px;
      }

      .card-info {
        padding: 6px;
      }

      .card-name {
        font-size: 10px;
      }

      .card-detail {
        font-size: 9px;
      }

      .stock-badge {
        top: 4px;
        right: 4px;
        min-width: 22px;
        height: 22px;
        font-size: 10px;
      }

      .filter-row {
        flex-direction: column;
      }

      .modal {
        padding: 12px;
      }

      .modal-content {
        padding: 16px;
      }
    }
  </style>
</head>

<body>

<header>
  <h1>🃏 MY TRECA</h1>
  <p>推しトレカ在庫管理</p>
</header>

<main>

  <div class="summary">
    <div class="summary-title">トレカ総数</div>
    <div class="summary-count" id="totalCount">0</div>
  </div>

  <div class="top-actions">
    <button class="add-button" onclick="openAddModal()">
      ＋ トレカを追加
    </button>
  </div>

  <div class="filter-area">

    <div class="filter-row">

      <div class="filter-box">
        <label>👤 メンバーで絞り込み</label>
        <select id="memberFilter" onchange="changeMemberFilter()">
          <option value="all">全メンバー</option>
        </select>
      </div>

      <div class="filter-box">
        <label>↕️ 並び替え</label>
        <select id="sortSelect" onchange="changeSort()">
          <option value="registered">登録順</option>
          <option value="costume">衣装順</option>
          <option value="name">名前順</option>
          <option value="member">メンバー順</option>
          <option value="count">所持枚数が多い順</option>
        </select>
      </div>

    </div>

  </div>

  <div class="grid" id="cardGrid"></div>

</main>


<!-- 詳細モーダル -->

<div class="modal" id="detailModal">

  <div class="modal-content">

    <h2 class="modal-title">🃏 トレカ詳細</h2>

    <img
      id="detailImage"
      class="detail-image"
      src=""
      alt="トレカ"
    >

    <div class="detail-info">

      <div class="detail-row">
        <span class="detail-label">カード名</span>
        <span class="detail-value" id="detailName"></span>
      </div>

      <div class="detail-row">
        <span class="detail-label">写り</span>
        <span class="detail-value" id="detailShot"></span>
      </div>

      <div class="detail-row">
        <span class="detail-label">メンバー</span>
        <span class="detail-value" id="detailMember"></span>
      </div>

      <div class="detail-row">
        <span class="detail-label">衣装</span>
        <span class="detail-value" id="detailCostume"></span>
      </div>

    </div>

    <div class="detail-count-area">

      <button
        class="count-button"
        onclick="changeDetailCount(-1)"
      >
        −
      </button>

      <div
        class="detail-count"
        id="detailCount"
      >
        0
      </div>

      <button
        class="count-button"
        onclick="changeDetailCount(1)"
      >
        ＋
      </button>

    </div>

    <div class="modal-buttons">

      <button
        class="modal-button button-close"
        onclick="closeDetailModal()"
      >
        閉じる
      </button>

      <button
        class="modal-button button-edit"
        onclick="openEditModal()"
      >
        ✏️ 編集
      </button>

    </div>

    <button
      class="button-delete"
      onclick="deleteSelectedCard()"
    >
      🗑️ このトレカを削除
    </button>

  </div>

</div>


<!-- 追加・編集モーダル -->

<div class="modal" id="editModal">

  <div class="modal-content">

    <h2 class="modal-title" id="editModalTitle">
      🃏 トレカを追加
    </h2>

    <div class="form-group">

      <label>📛 カード名</label>

      <div class="select-add-row">

        <select id="nameInput">
          <option value="">カード名を選択</option>
        </select>

        <button
          type="button"
          class="small-add-button"
          onclick="addMaster('names')"
        >
          ＋追加
        </button>

      </div>

    </div>


    <div class="form-group">

      <label>👤 メンバー</label>

      <div class="select-add-row">

        <select id="memberInput">
          <option value="">メンバーを選択</option>
        </select>

        <button
          type="button"
          class="small-add-button"
          onclick="addMaster('members')"
        >
          ＋追加
        </button>

      </div>

    </div>


    <div class="form-group">

      <label>👗 衣装</label>

      <div class="select-add-row">

        <select id="costumeInput">
          <option value="">衣装を選択</option>
        </select>

        <button
          type="button"
          class="small-add-button"
          onclick="addMaster('costumes')"
        >
          ＋追加
        </button>

      </div>

      <div class="help-text">
        新しい衣装が出たら「＋追加」から登録できます♡
      </div>

    </div>


    <div class="form-group">

      <label>📸 写り</label>

      <select id="shotInput">
        <option value="ヒキ">ヒキ</option>
        <option value="ヨリ">ヨリ</option>
        <option value="自撮り1">自撮り1</option>
        <option value="自撮り2">自撮り2</option>
      </select>

    </div>


    <div class="form-group">

      <label>🔢 所持枚数</label>

      <input
        type="number"
        id="countInput"
        min="0"
        value="1"
      >

    </div>


    <div class="form-group">

      <label>📷 写真</label>

      <div class="photo-area">

        <input
          type="file"
          id="photoInput"
          accept="image/*"
          onchange="previewPhoto()"
        >

        <img
          id="photoPreview"
          class="photo-preview"
          src=""
          alt="プレビュー"
        >

        <div class="help-text">
          編集時は写真を選び直さなければ現在の写真をそのまま使います
        </div>

      </div>

    </div>


    <button
      class="save-button"
      onclick="saveCard()"
    >
      💾 保存する
    </button>

    <button
      class="cancel-button"
      onclick="closeEditModal()"
    >
      キャンセル
    </button>

  </div>

</div>


<script>

  /* =========================
     データ
  ========================= */

  const STORAGE_KEY = "myTrecaCards_v2";
  const MASTER_KEY = "myTrecaMasters_v2";

  const DEFAULT_COSTUMES = [
    "浴衣",
    "47白衣装",
    "MF",
    "MFcb"
  ];

  const SHOTS = [
    "ヒキ",
    "ヨリ",
    "自撮り1",
    "自撮り2"
  ];


  function loadCards() {

    try {

      const data = localStorage.getItem(STORAGE_KEY);

      if (!data) {
        return [];
      }

      const parsed = JSON.parse(data);

      return Array.isArray(parsed) ? parsed : [];

    } catch (error) {

      console.error(error);

      return [];

    }

  }


  function loadMasters() {

    try {

      const data = localStorage.getItem(MASTER_KEY);

      if (!data) {

        return {
          names: [],
          members: [],
          costumes: [...DEFAULT_COSTUMES]
        };

      }

      const parsed = JSON.parse(data);

      return {
        names: Array.isArray(parsed.names)
          ? parsed.names
          : [],

        members: Array.isArray(parsed.members)
          ? parsed.members
          : [],

        costumes: Array.isArray(parsed.costumes)
          ? parsed.costumes
          : [...DEFAULT_COSTUMES]
      };

    } catch (error) {

      console.error(error);

      return {
        names: [],
        members: [],
        costumes: [...DEFAULT_COSTUMES]
      };

    }

  }


  let cards = loadCards();

  let masters = loadMasters();

  let selectedCardId = null;

  let editingCardId = null;

  let currentSort = "registered";

  let memberFilter = "all";


  /* =========================
     保存
  ========================= */

  function save() {

    try {

      localStorage.setItem(
        STORAGE_KEY,
        JSON.stringify(cards)
      );

      return true;

    } catch (error) {

      alert(
        "保存できませんでした😭\n" +
        error.message
      );

      return false;

    }

  }


  function saveMasters() {

    try {

      localStorage.setItem(
        MASTER_KEY,
        JSON.stringify(masters)
      );

      return true;

    } catch (error) {

      alert(
        "候補を保存できませんでした😭\n" +
        error.message
      );

      return false;

    }

  }


  /* =========================
     マスター整理
  ========================= */

  function uniquePush(array, value) {

    if (!value) {
      return;
    }

    if (!array.includes(value)) {
      array.push(value);
    }

  }


  function initializeMasters() {

    cards.forEach(card => {

      uniquePush(masters.names, card.name);

      uniquePush(masters.members, card.member);

      uniquePush(masters.costumes, card.costume);

    });


    DEFAULT_COSTUMES.forEach(costume => {

      uniquePush(masters.costumes, costume);

    });


    saveMasters();

  }


  initializeMasters();


  /* =========================
     マスター追加
  ========================= */

  function addMaster(type) {

    const labels = {
      names: "カード名",
      members: "メンバー名",
      costumes: "衣装"
    };

    const label = labels[type];

    const value = prompt(
      `新しい${label}を入力してください♡`
    );

    if (value === null) {
      return;
    }

    const trimmed = value.trim();

    if (!trimmed) {

      alert(
        `${label}を入力してください🥺`
      );

      return;

    }


    if (masters[type].includes(trimmed)) {

      alert(
        `「${trimmed}」はすでに登録されています！`
      );

      return;

    }


    const backup = [...masters[type]];

    masters[type].push(trimmed);

    if (!saveMasters()) {

      masters[type] = backup;

      return;

    }


    refreshAllSelects(trimmed, type);

  }


  /* =========================
     プルダウン
  ========================= */

  function setSelectOptions(
    selectId,
    values,
    placeholder,
    selectedValue = ""
  ) {

    const select = document.getElementById(selectId);

    if (!select) {
      return;
    }


    select.innerHTML = "";


    const placeholderOption =
      document.createElement("option");

    placeholderOption.value = "";

    placeholderOption.textContent = placeholder;

    select.appendChild(placeholderOption);


    values.forEach(value => {

      if (!value) {
        return;
      }

      const option =
        document.createElement("option");

      option.value = value;

      option.textContent = value;

      select.appendChild(option);

    });


    select.value = selectedValue;

  }


  function refreshEditSelects(
    selectedName = "",
    selectedMember = "",
    selectedCostume = ""
  ) {

    setSelectOptions(
      "nameInput",
      masters.names,
      "カード名を選択",
      selectedName
    );


    setSelectOptions(
      "memberInput",
      masters.members,
      "メンバーを選択",
      selectedMember
    );


    setSelectOptions(
      "costumeInput",
      masters.costumes,
      "衣装を選択",
      selectedCostume
    );

  }


  function refreshAllSelects(
    newlyAddedValue = "",
    type = ""
  ) {

    const currentName =
      document.getElementById("nameInput")?.value || "";

    const currentMember =
      document.getElementById("memberInput")?.value || "";

    const currentCostume =
      document.getElementById("costumeInput")?.value || "";


    refreshEditSelects(
      type === "names"
        ? newlyAddedValue
        : currentName,

      type === "members"
        ? newlyAddedValue
        : currentMember,

      type === "costumes"
        ? newlyAddedValue
        : currentCostume
    );


    renderMemberFilter();

  }


  function renderMemberFilter() {

    const select =
      document.getElementById("memberFilter");

    if (!select) {
      return;
    }


    const currentValue = memberFilter;


    select.innerHTML = "";


    const allOption =
      document.createElement("option");

    allOption.value = "all";

    allOption.textContent = "全メンバー";

    select.appendChild(allOption);


    masters.members.forEach(member => {

      const option =
        document.createElement("option");

      option.value = member;

      option.textContent = member;

      select.appendChild(option);

    });


    if (
      currentValue === "all" ||
      masters.members.includes(currentValue)
    ) {

      select.value = currentValue;

    } else {

      memberFilter = "all";

      select.value = "all";

    }

  }


  /* =========================
     並び替え・絞り込み
  ========================= */

  function changeSort() {

    currentSort =
      document.getElementById("sortSelect").value;

    render();

  }


  function changeMemberFilter() {

    memberFilter =
      document.getElementById("memberFilter").value;

    render();

  }


  function getVisibleCards() {

    let result = [...cards];


    if (memberFilter !== "all") {

      result = result.filter(card => {

        return (card.member || "") === memberFilter;

      });

    }


    if (currentSort === "name") {

      result.sort((a, b) => {

        return (a.name || "").localeCompare(
          b.name || "",
          "ja"
        );

      });

    }
else if (currentSort === "costume") {

  result.sort((a, b) => {

    const indexA =
      masters.costumes.indexOf(a.costume);

    const indexB =
      masters.costumes.indexOf(b.costume);

    const orderA =
      indexA === -1 ? 9999 : indexA;

    const orderB =
      indexB === -1 ? 9999 : indexB;

    return orderA - orderB;

  });

}

    else if (currentSort === "member") {

      result.sort((a, b) => {

        return (a.member || "").localeCompare(
          b.member || "",
          "ja"
        );

      });

    }

    else if (currentSort === "count") {

      result.sort((a, b) => {

        return Number(b.count || 0) -
               Number(a.count || 0);

      });

    }

    else {

      result.sort((a, b) => {

        return Number(a.id || 0) -
               Number(b.id || 0);

      });

    }


    return result;

  }


  /* =========================
     カード検索
  ========================= */

  function findCard(id) {

    return cards.find(card => {

      return String(card.id) === String(id);

    });

  }


  /* =========================
     一覧表示
  ========================= */

  function render() {

    const grid =
      document.getElementById("cardGrid");


    document.getElementById("totalCount")
      .textContent =
      cards.reduce(
        (total, card) =>
          total + Number(card.count || 0),
        0
      );


    renderMemberFilter();


    grid.innerHTML = "";


    const visibleCards =
      getVisibleCards();


    if (visibleCards.length === 0) {

      grid.innerHTML = `
        <div class="empty">
          <div class="empty-icon">🃏</div>
          <div>トレカがまだありません♡</div>
          <div style="font-size:11px;margin-top:5px;">
            「トレカを追加」から登録してね！
          </div>
        </div>
      `;

      return;

    }


    visibleCards.forEach(card => {

      const wrapper =
        document.createElement("div");

      wrapper.className = "card";

      wrapper.onclick = () => {

        openDetailModal(card.id);

      };


      const imageWrap =
        document.createElement("div");

      imageWrap.className =
        "card-image-wrap";


      const image =
        document.createElement("img");

      image.className = "card-image";

      image.src = card.image;

      image.alt = card.name || "トレカ";


      const badge =
        document.createElement("div");

      badge.className = "stock-badge";

      badge.textContent =
        Number(card.count || 0);


      imageWrap.appendChild(image);

      imageWrap.appendChild(badge);


      const info =
        document.createElement("div");

      info.className = "card-info";


      const name =
        document.createElement("div");

      name.className = "card-name";

      name.textContent =
        card.costume || "未設定";


      const detail =
        document.createElement("div");

      detail.className = "card-detail";

      const member =
        card.member || "未設定";

      const shot =
        card.shot || "未設定";


      detail.textContent =
        `${shot} / ${member} / ${card.name||"未設定"}`;


      info.appendChild(name);

      info.appendChild(detail);


      wrapper.appendChild(imageWrap);

      wrapper.appendChild(info);


      grid.appendChild(wrapper);

    });

  }


  /* =========================
     詳細
  ========================= */

  function openDetailModal(id) {

    const card = findCard(id);

    if (!card) {
      return;
    }


    selectedCardId = id;


    document.getElementById("detailImage")
      .src = card.image;


    document.getElementById("detailName")
      .textContent =
      card.name || "未設定";


    document.getElementById("detailShot")
      .textContent =
      card.shot || "未設定";


    document.getElementById("detailMember")
      .textContent =
      card.member || "未設定";


    document.getElementById("detailCostume")
      .textContent =
      card.costume || "未設定";


    document.getElementById("detailCount")
      .textContent =
      Number(card.count || 0);


    document.getElementById("detailModal")
      .classList.add("show");

  }


  function closeDetailModal() {

    document.getElementById("detailModal")
      .classList.remove("show");

    selectedCardId = null;

  }


  /* =========================
     詳細画面の枚数変更
  ========================= */

  function changeDetailCount(amount) {

    if (selectedCardId === null) {
      return;
    }


    const card =
      findCard(selectedCardId);


    if (!card) {
      return;
    }


    const oldCount =
      Number(card.count || 0);


    const newCount =
      Math.max(0, oldCount + amount);


    card.count = newCount;


    if (!save()) {

      card.count = oldCount;

      return;

    }


    document.getElementById("detailCount")
      .textContent = newCount;


    render();

  }


  /* =========================
     削除
  ========================= */

  function deleteSelectedCard() {

    if (selectedCardId === null) {
      return;
    }


    deleteCard(selectedCardId);

  }


  function deleteCard(id) {

    const card = findCard(id);

    if (!card) {
      return;
    }


    const ok =
      confirm(
        `「${card.name || "このトレカ"}」を削除しますか？`
      );


    if (!ok) {
      return;
    }


    const backup = [...cards];


    cards =
      cards.filter(item => {

        return String(item.id) !== String(id);

      });


    if (!save()) {

      cards = backup;

      return;

    }


    if (
      selectedCardId !== null &&
      String(selectedCardId) === String(id)
    ) {

      closeDetailModal();

    }


    render();

  }


  /* =========================
     編集
  ========================= */

  function openEditModal() {

    if (selectedCardId === null) {
      return;
    }


    const card =
      findCard(selectedCardId);


    if (!card) {
      return;
    }


    editingCardId = selectedCardId;


    document.getElementById("editModalTitle")
      .textContent =
      "✏️ トレカを編集";


    refreshEditSelects(
      card.name || "",
      card.member || "",
      card.costume || ""
    );


    document.getElementById("shotInput")
      .innerHTML = "";


    SHOTS.forEach(shot => {

      const option =
        document.createElement("option");

      option.value = shot;

      option.textContent = shot;

      document.getElementById("shotInput")
        .appendChild(option);

    });


    /*
      以前のバージョンで
      4種類以外の写りを登録していた場合、
      データを勝手に消さないため
      一時的に選択肢として残します。
    */

    if (
      card.shot &&
      !SHOTS.includes(card.shot)
    ) {

      const legacyOption =
        document.createElement("option");

      legacyOption.value = card.shot;

      legacyOption.textContent =
        "旧データ：" + card.shot;

      document.getElementById("shotInput")
        .appendChild(legacyOption);

    }


    document.getElementById("shotInput")
      .value =
      card.shot || SHOTS[0];


    document.getElementById("countInput")
      .value =
      Number(card.count || 0);


    const preview =
      document.getElementById("photoPreview");


    if (card.image) {

      preview.src = card.image;

      preview.style.display = "block";

    } else {

      preview.style.display = "none";

    }


    document.getElementById("photoInput")
      .value = "";


    closeDetailModal();


    document.getElementById("editModal")
      .classList.add("show");

  }


  /* =========================
     新規追加
  ========================= */

  function openAddModal() {

    editingCardId = null;


    document.getElementById("editModalTitle")
      .textContent =
      "🃏 トレカを追加";


    refreshEditSelects();


    document.getElementById("shotInput")
      .value = "ヒキ";


    document.getElementById("countInput")
      .value = 1;


    document.getElementById("photoInput")
      .value = "";


    const preview =
      document.getElementById("photoPreview");

    preview.src = "";

    preview.style.display = "none";


    document.getElementById("editModal")
      .classList.add("show");

  }


  function closeEditModal() {

    document.getElementById("editModal")
      .classList.remove("show");

    editingCardId = null;

  }


  /* =========================
     写真プレビュー
  ========================= */

  function previewPhoto() {

    const file =
      document.getElementById("photoInput")
        .files[0];


    if (!file) {
      return;
    }


    const reader =
      new FileReader();


    reader.onload = function(event) {

      const preview =
        document.getElementById("photoPreview");


      preview.src =
        event.target.result;


      preview.style.display =
        "block";

    };


    reader.readAsDataURL(file);

  }


  /* =========================
     カード保存
  ========================= */

  async function saveCard() {

    const name =
      document.getElementById("nameInput").value;


    const member =
      document.getElementById("memberInput").value;


    const costume =
      document.getElementById("costumeInput").value;


    const shot =
      document.getElementById("shotInput").value;


    const count =
      Math.max(
        0,
        Number(
          document.getElementById("countInput").value
        ) || 0
      );


    if (!name) {

      alert(
        "カード名を選択してください🥺"
      );

      return;

    }


    if (!member) {

      alert(
        "メンバーを選択してください🥺"
      );

      return;

    }


    const file =
      document.getElementById("photoInput")
        .files[0];


    /* =====================
       編集
    ===================== */

    if (editingCardId !== null) {

      const card =
        findCard(editingCardId);


      if (!card) {
        return;
      }


      const backup = {
        name: card.name,
        member: card.member,
        costume: card.costume,
        shot: card.shot,
        count: card.count,
        image: card.image
      };


      card.name = name;

      card.member = member;

      card.costume = costume;

      card.shot = shot;

      card.count = count;


      if (file) {

        try {

          card.image =
            await compressImage(file);

        } catch (error) {

          alert(
            "写真の処理に失敗しました😭"
          );

          card.name = backup.name;
          card.member = backup.member;
          card.costume = backup.costume;
          card.shot = backup.shot;
          card.count = backup.count;
          card.image = backup.image;

          return;

        }

      }


      if (!save()) {

        card.name = backup.name;
        card.member = backup.member;
        card.costume = backup.costume;
        card.shot = backup.shot;
        card.count = backup.count;
        card.image = backup.image;

        return;

      }


      closeEditModal();

      render();

      return;

    }


    /* =====================
       新規追加
    ===================== */

    if (!file) {

      alert(
        "トレカの写真を選択してください📷"
      );

      return;

    }


    let image;

    try {

      image =
        await compressImage(file);

    } catch (error) {

      alert(
        "写真の処理に失敗しました😭"
      );

      return;

    }


    const newCard = {

      id:
        Date.now(),

      image:
        image,

      name:
        name,

      member:
        member,

      costume:
        costume,

      shot:
        shot,

      count:
        count

    };


    cards.push(newCard);


    if (!save()) {

      cards.pop();

      return;

    }


    closeEditModal();

    render();

  }


  /* =========================
     写真圧縮
  ========================= */

  function compressImage(file) {

    return new Promise((resolve, reject) => {

      const reader =
        new FileReader();


      reader.onload = function(event) {

        const img =
          new Image();


        img.onload = function() {

          const maxSize = 800;


          let width =
            img.width;

          let height =
            img.height;


          if (
            width > maxSize ||
            height > maxSize
          ) {

            if (width > height) {

              height =
                Math.round(
                  height * maxSize / width
                );

              width =
                maxSize;

            } else {

              width =
                Math.round(
                  width * maxSize / height
                );

              height =
                maxSize;

            }

          }


          const canvas =
            document.createElement("canvas");


          canvas.width =
            width;

          canvas.height =
            height;


          const ctx =
            canvas.getContext("2d");


          ctx.drawImage(
            img,
            0,
            0,
            width,
            height
          );


          const compressed =
            canvas.toDataURL(
              "image/jpeg",
              0.7
            );


          resolve(compressed);

        };


        img.onerror =
          reject;


        img.src =
          event.target.result;

      };


      reader.onerror =
        reject;


      reader.readAsDataURL(file);

    });

  }


  /* =========================
     初期表示
  ========================= */

  render();

</script>
