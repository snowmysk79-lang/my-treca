<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>MY TRECA</title>

<style>
* {
  box-sizing: border-box;
}

body {
  margin: 0;
  font-family: -apple-system, BlinkMacSystemFont, "Helvetica Neue", sans-serif;
  background: #f7fbfa;
  color: #333;
}

header {
  background: white;
  padding: 24px 18px 18px;
  border-bottom: 1px solid #e5eeee;
  position: sticky;
  top: 0;
  z-index: 10;
}

.logo {
  font-size: 24px;
  font-weight: 800;
  color: #f3a6bd;
}

.subtitle {
  font-size: 12px;
  color: #888;
  margin-top: 3px;
}

.container {
  max-width: 900px;
  margin: auto;
  padding: 18px;
}

.summary {
  background: white;
  border-radius: 18px;
  padding: 16px;
  margin-bottom: 18px;
  box-shadow: 0 3px 15px rgba(0,0,0,0.04);
}

.summary-number {
  font-size: 26px;
  font-weight: 800;
  color: #f3a6bd;
}

.summary-label {
  font-size: 12px;
  color: #888;
}

button {
  border: none;
  cursor: pointer;
  font-family: inherit;
}

.add-button {
  width: 100%;
  padding: 14px;
  border-radius: 14px;
  background: #f3a6bd;
  color: white;
  font-size: 15px;
  font-weight: 700;
  margin-bottom: 14px;
}

.add-button:active {
  transform: scale(0.98);
}

/* 並び替え */

.sort-area {
  background: white;
  padding: 12px 14px;
  border-radius: 14px;
  margin-bottom: 18px;
  box-shadow: 0 3px 12px rgba(0,0,0,0.04);
}

.sort-title {
  font-size: 12px;
  color: #777;
  margin-bottom: 6px;
}

.sort-select {
  width: 100%;
  padding: 10px;
  border: 1px solid #dce7e5;
  border-radius: 10px;
  background: white;
  font-size: 14px;
  outline: none;
}

.sort-select:focus {
  border-color: #f3a6bd;
}

/* カード一覧 */

.grid {
  display: grid;
  grid-template-columns: repeat(4, 1fr);
  gap: 12px;
}

.card {
  background: white;
  border-radius: 14px;
  overflow: hidden;
  box-shadow: 0 3px 12px rgba(0,0,0,0.06);
  cursor: pointer;
}

.image-wrap {
  position: relative;
  aspect-ratio: 2 / 3;
  background: #edf3f2;
}

.image-wrap img {
  width: 100%;
  height: 100%;
  object-fit: cover;
  display: block;
  pointer-events: none;
}

.stock {
  position: absolute;
  top: 7px;
  right: 7px;
  min-width: 30px;
  height: 30px;
  padding: 0 8px;
  border-radius: 15px;
  background: #f3a6bd;
  color: white;
  display: flex;
  align-items: center;
  justify-content: center;
  font-size: 13px;
  font-weight: 800;
  box-shadow: 0 2px 7px rgba(0,0,0,0.18);
}

.card-info {
  padding: 9px;
}

.card-name {
  font-weight: 700;
  font-size: 13px;
  white-space: nowrap;
  overflow: hidden;
  text-overflow: ellipsis;
}

.card-shot {
  font-size: 11px;
  color: #888;
  margin-top: 3px;
}

.member {
  font-size: 11px;
  color: #888;
  margin-top: 3px;
}

.counter {
  display: flex;
  align-items: center;
  justify-content: space-between;
  margin-top: 8px;
}

.counter button {
  width: 28px;
  height: 28px;
  border-radius: 50%;
  background: #edf7f5;
  color: #f3a6bd;
  font-size: 18px;
  font-weight: bold;
}

.count {
  font-size: 14px;
  font-weight: 800;
}

.delete {
  margin-top: 7px;
  width: 100%;
  background: transparent;
  color: #aaa;
  font-size: 10px;
  padding: 3px;
}

.empty {
  text-align: center;
  color: #999;
  padding: 60px 20px;
}

/* モーダル */

.modal-bg {
  display: none;
  position: fixed;
  inset: 0;
  background: rgba(0,0,0,0.45);
  z-index: 100;
  align-items: center;
  justify-content: center;
  padding: 20px;
}

.modal {
  background: white;
  width: 100%;
  max-width: 420px;
  max-height: 90vh;
  overflow-y: auto;
  border-radius: 22px;
  padding: 22px;
}

.modal h2 {
  margin-top: 0;
  font-size: 20px;
}

.detail-image {
  width: 120px;
  height: 180px;
  object-fit: cover;
  display: block;
  margin: 0 auto 18px;
  border-radius: 10px;
}

.detail-name {
  text-align: center;
  font-size: 20px;
  font-weight: 800;
}

.detail-shot,
.detail-member {
  text-align: center;
  color: #888;
  font-size: 13px;
  margin-top: 5px;
}

.detail-stock {
  text-align: center;
  margin: 15px 0;
}

.detail-stock-number {
  font-size: 30px;
  font-weight: 800;
  color: #f3a6bd;
}

.detail-stock-label {
  font-size: 12px;
  color: #888;
}

.detail-buttons {
  display: flex;
  gap: 8px;
  margin-top: 20px;
}

.edit-button {
  flex: 1;
  padding: 13px;
  border-radius: 12px;
  background: #f3a6bd;
  color: white;
  font-weight: bold;
}

.close-button {
  flex: 1;
  padding: 13px;
  border-radius: 12px;
  background: #eee;
}

/* 入力 */

label {
  display: block;
  font-size: 12px;
  color: #777;
  margin-top: 14px;
  margin-bottom: 5px;
}

input {
  width: 100%;
  padding: 12px;
  border: 1px solid #dce7e5;
  border-radius: 10px;
  font-size: 14px;
  outline: none;
}

input:focus {
  border-color: #f3a6bd;
}

.photo-label {
  display: flex;
  align-items: center;
  justify-content: center;
  height: 130px;
  border: 2px dashed #b9ddd5;
  border-radius: 14px;
  color: #f3a6bd;
  font-weight: 700;
  cursor: pointer;
  text-align: center;
}

.photo-label input {
  display: none;
}

.preview {
  display: none;
  width: 90px;
  height: 120px;
  object-fit: cover;
  border-radius: 8px;
  margin: auto;
}

.modal-buttons {
  display: flex;
  gap: 8px;
  margin-top: 20px;
}

.cancel {
  flex: 1;
  padding: 13px;
  border-radius: 12px;
  background: #eee;
}

.save {
  flex: 1;
  padding: 13px;
  border-radius: 12px;
  background: #f3a6bd;
  color: white;
  font-weight: bold;
}

@media (max-width: 500px) {
  .grid {
    grid-template-columns: repeat(4, 1fr);
  }
}
</style>
</head>

<body>

<header>
  <div class="container" style="padding:0;">
    <div class="logo">🃏 MY TRECA</div>
    <div class="subtitle">推しトレカ在庫管理</div>
  </div>
</header>

<main class="container">

  <div class="summary">
    <div class="summary-number" id="totalCount">0</div>
    <div class="summary-label">現在のトレカ総数</div>
  </div>

  <button class="add-button" onclick="openAddModal()">
    ＋ トレカを追加
  </button>

  <div class="sort-area">

    <div class="sort-title">
      並び替え
    </div>

    <select
      id="sortSelect"
      class="sort-select"
      onchange="changeSort()"
    >

      <option value="registered">
        登録順
      </option>

      <option value="name">
        名前順
      </option>

      <option value="member">
        メンバー順
      </option>

      <option value="count">
        所持枚数が多い順
      </option>

    </select>

  </div>

  <div id="cardGrid" class="grid"></div>

  <div id="empty" class="empty">
    まだトレカが登録されていません🥹<br>
    「＋ トレカを追加」から登録してみてね🃏
  </div>

</main>


<!-- 詳細画面 -->

<div class="modal-bg" id="detailModal">

  <div class="modal">

    <h2>🃏 トレカ詳細</h2>

    <img id="detailImage" class="detail-image">

    <div id="detailName" class="detail-name"></div>

    <div id="detailShot" class="detail-shot"></div>

    <div id="detailMember" class="detail-member"></div>

    <div class="detail-stock">

      <div
        id="detailStock"
        class="detail-stock-number"
      >
        0
      </div>

      <div class="detail-stock-label">
        所持枚数
      </div>

    </div>

    <div class="detail-buttons">

      <button
        class="close-button"
        onclick="closeDetailModal()"
      >
        閉じる
      </button>

      <button
        class="edit-button"
        onclick="openEditModal()"
      >
        ✏️ 編集
      </button>

    </div>

  </div>

</div>


<!-- 追加・編集画面 -->

<div class="modal-bg" id="editModal">

  <div class="modal">

    <h2 id="editTitle">
      🃏 トレカを追加
    </h2>

    <label>カード写真</label>

    <label class="photo-label">

      <span id="photoText">
        📸 写真を選択
      </span>

      <input
        type="file"
        accept="image/*"
        id="photoInput"
        onchange="previewPhoto(event)"
      >

    </label>

    <img
      id="preview"
      class="preview"
    >

    <label>カード名</label>

    <input
      id="nameInput"
      placeholder="例：A-001"
    >

    <label>写り</label>

    <input
      id="shotInput"
      placeholder="例：アップ"
    >

    <label>メンバー</label>

    <input
      id="memberInput"
      placeholder="例：○○くん"
    >

    <label>所持枚数</label>

    <input
      id="countInput"
      type="number"
      min="0"
      value="1"
    >

    <div class="modal-buttons">

      <button
        class="cancel"
        onclick="closeEditModal()"
      >
        キャンセル
      </button>

      <button
        class="save"
        onclick="saveCard()"
      >
        保存する
      </button>

    </div>

  </div>

</div>


<script>

/* データ */

let cards = JSON.parse(
  localStorage.getItem("myTrecaCards") || "[]"
);

let selectedCardId = null;

let editingCardId = null;

let currentSort = "registered";


/* 保存 */

function save() {

  try {

    localStorage.setItem(
      "myTrecaCards",
      JSON.stringify(cards)
    );

    return true;

  } catch (error) {

    alert(
      "保存できませんでした😭\n" +
      error.message
    );

    return false;
  }
}


/* 並び替え */

function changeSort() {

  currentSort =
    document.getElementById(
      "sortSelect"
    ).value;

  render();
}


function getSortedCards() {

  const sorted = [...cards];

  if (currentSort === "name") {

    sorted.sort(function(a, b) {

      return (a.name || "").localeCompare(
        b.name || "",
        "ja"
      );

    });

  } else if (currentSort === "member") {

    sorted.sort(function(a, b) {

      return (a.member || "").localeCompare(
        b.member || "",
        "ja"
      );

    });

  } else if (currentSort === "count") {

    sorted.sort(function(a, b) {

      return Number(b.count) - Number(a.count);

    });

  } else {

    sorted.sort(function(a, b) {

      return Number(a.id) - Number(b.id);

    });

  }

  return sorted;
}


/* 一覧表示 */

function render() {

  const grid =
    document.getElementById("cardGrid");

  const empty =
    document.getElementById("empty");

  grid.innerHTML = "";

  if (cards.length === 0) {

    empty.style.display = "block";

  } else {

    empty.style.display = "none";

  }

  let total = 0;

  cards.forEach(function(card) {

    total += Number(card.count);

  });


  const sortedCards =
    getSortedCards();


  sortedCards.forEach(function(card) {

    const div =
      document.createElement("div");

    div.className = "card";


    div.onclick = function() {

      openDetailModal(card.id);

    };


    div.innerHTML = `

      <div class="image-wrap">

        <img src="${card.image}">

        <div class="stock">
          ${card.count}
        </div>

      </div>

      <div class="card-info">

        <div class="card-name">
          ${escapeHtml(card.name)}
        </div>

        <div class="card-shot">
          ${escapeHtml(card.shot || "")}
        </div>

        <div class="member">
          ${escapeHtml(card.member || "")}
        </div>

        <div class="counter">

          <button
            onclick="
              event.stopPropagation();
              changeCount('${card.id}', -1);
            "
          >
            −
          </button>

          <span class="count">
            ${card.count}
          </span>

          <button
            onclick="
              event.stopPropagation();
              changeCount('${card.id}', 1);
            "
          >
            ＋
          </button>

        </div>

        <button
          class="delete"
          onclick="
            event.stopPropagation();
            deleteCard('${card.id}');
          "
        >
          削除
        </button>

      </div>

    `;

    grid.appendChild(div);

  });


  document.getElementById(
    "totalCount"
  ).textContent = total;
}


/* IDからカードを探す */

function findCard(id) {

  return cards.find(function(card) {

    return String(card.id) === String(id);

  });

}


/* 枚数変更 */

function changeCount(id, amount) {

  const card =
    findCard(id);

  if (!card) {
    return;
  }

  card.count = Math.max(
    0,
    Number(card.count) + amount
  );

  save();

  render();
}


/* 削除 */

function deleteCard(id) {

  const card =
    findCard(id);

  if (!card) {
    return;
  }

  if (
    !confirm(
      "このトレカを削除しますか？"
    )
  ) {
    return;
  }

  cards =
    cards.filter(function(item) {

      return String(item.id) !== String(id);

    });

  save();

  render();
}


/* 詳細画面 */

function openDetailModal(id) {

  const card =
    findCard(id);

  if (!card) {
    return;
  }

  selectedCardId =
    card.id;

  document.getElementById(
    "detailImage"
  ).src = card.image;

  document.getElementById(
    "detailName"
  ).textContent = card.name;

  document.getElementById(
    "detailShot"
  ).textContent =
    card.shot || "";

  document.getElementById(
    "detailMember"
  ).textContent =
    card.member || "";

  document.getElementById(
    "detailStock"
  ).textContent =
    card.count;

  document.getElementById(
    "detailModal"
  ).style.display = "flex";
}


function closeDetailModal() {

  document.getElementById(
    "detailModal"
  ).style.display = "none";
}


/* 編集画面 */

function openEditModal() {

  if (selectedCardId === null) {
    return;
  }

  const card =
    findCard(selectedCardId);

  if (!card) {
    return;
  }

  editingCardId =
    card.id;

  document.getElementById(
    "editTitle"
  ).textContent =
    "✏️ トレカを編集";

  document.getElementById(
    "nameInput"
  ).value =
    card.name || "";

  document.getElementById(
    "shotInput"
  ).value =
    card.shot || "";

  document.getElementById(
    "memberInput"
  ).value =
    card.member || "";

  document.getElementById(
    "countInput"
  ).value =
    card.count;

  document.getElementById(
    "photoInput"
  ).value = "";

  document.getElementById(
    "preview"
  ).style.display = "none";

  document.getElementById(
    "photoText"
  ).style.display = "block";

  document.getElementById(
    "photoText"
  ).textContent =
    "📸 写真を変更する場合は選択";

  closeDetailModal();

  document.getElementById(
    "editModal"
  ).style.display = "flex";
}


/* 新規追加画面 */

function openAddModal() {

  editingCardId = null;

  document.getElementById(
    "editTitle"
  ).textContent =
    "🃏 トレカを追加";

  document.getElementById(
    "photoInput"
  ).value = "";

  document.getElementById(
    "nameInput"
  ).value = "";

  document.getElementById(
    "shotInput"
  ).value = "";

  document.getElementById(
    "memberInput"
  ).value = "";

  document.getElementById(
    "countInput"
  ).value = "1";

  document.getElementById(
    "preview"
  ).style.display = "none";

  document.getElementById(
    "photoText"
  ).style.display = "block";

  document.getElementById(
    "photoText"
  ).textContent =
    "📸 写真を選択";

  document.getElementById(
    "editModal"
  ).style.display = "flex";
}


function closeEditModal() {

  document.getElementById(
    "editModal"
  ).style.display = "none";
}


/* 写真プレビュー */

function previewPhoto(event) {

  const file =
    event.target.files[0];

  if (!file) {
    return;
  }

  const reader =
    new FileReader();

  reader.onload = function(e) {

    const preview =
      document.getElementById(
        "preview"
      );

    preview.src =
      e.target.result;

    preview.style.display =
      "block";

    document.getElementById(
      "photoText"
    ).style.display =
      "none";
  };

  reader.readAsDataURL(file);
}


/* カード保存 */

function saveCard() {

  const file =
    document.getElementById(
      "photoInput"
    ).files[0];

  const name =
    document.getElementById(
      "nameInput"
    ).value || "カード";

  const shot =
    document.getElementById(
      "shotInput"
    ).value || "";

  const member =
    document.getElementById(
      "memberInput"
    ).value || "";

  const count =
    Number(
      document.getElementById(
        "countInput"
      ).value
    ) || 0;


  /* 編集 */

  if (editingCardId !== null) {

    const card =
      findCard(editingCardId);

    if (!card) {
      return;
    }

    card.name =
      name;

    card.shot =
      shot;

    card.member =
      member;

    card.count =
      count;


    if (file) {

      compressImage(
        file,
        function(compressedImage) {

          card.image =
            compressedImage;

          if (save()) {

            render();

            closeEditModal();

          }

        }
      );

    } else {

      if (save()) {

        render();

        closeEditModal();

      }

    }

    return;
  }


  /* 新規追加 */

  if (!file) {

    alert(
      "カード写真を選択してください📸"
    );

    return;
  }


  compressImage(
    file,
    function(compressedImage) {

      cards.push({

        id: Date.now(),

        image:
          compressedImage,

        name:
          name,

        shot:
          shot,

        member:
          member,

        count:
          count

      });


      if (save()) {

        render();

        closeEditModal();

      }

    }
  );
}


/* 画像圧縮 */

function compressImage(
  file,
  callback
) {

  const reader =
    new FileReader();

  reader.onload =
    function(e) {

      const img =
        new Image();

      img.onload =
        function() {

          const maxSize =
            800;

          let width =
            img.width;

          let height =
            img.height;


          if (
            width > maxSize ||
            height > maxSize
          ) {

            if (
              width > height
            ) {

              height =
                height *
                (maxSize / width);

              width =
                maxSize;

            } else {

              width =
                width *
                (maxSize / height);

              height =
                maxSize;

            }

          }


          const canvas =
            document.createElement(
              "canvas"
            );

          canvas.width =
            width;

          canvas.height =
            height;


          const ctx =
            canvas.getContext(
              "2d"
            );

          ctx.drawImage(
            img,
            0,
            0,
            width,
            height
          );


          const compressedImage =
            canvas.toDataURL(
              "image/jpeg",
              0.7
            );


          callback(
            compressedImage
          );

        };


      img.src =
        e.target.result;

    };


  reader.readAsDataURL(file);
}


/* HTML安全処理 */

function escapeHtml(text) {

  const div =
    document.createElement(
      "div"
    );

  div.textContent =
    text;

  return div.innerHTML;
}


render();

</script>

</body>
</html>
